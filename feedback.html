<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | CreativePort</title>
    <meta name="description" content="Share your feedback to help us improve CreativePort.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; --gold-dark: #C5A000; --black: #0a0a0f; --panel: #111116; --border: #2a2a2f; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--black); color: #e8e8e8; min-height: 100vh; }
        .gradient-text { background: linear-gradient(135deg, var(--gold), #FFE55C); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .glass { background: rgba(255,215,0,0.03); border: 1px solid rgba(255,215,0,0.08); border-radius: 16px; }
        .btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #000; border: none; padding: 14px 32px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: all 0.3s; font-size: 0.95rem; width: 100%; }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,215,0,0.3); }
        .btn-gold:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .nav-link { color: #888; transition: all 0.3s; font-weight: 500; font-size: 0.9rem; }
        .nav-link:hover, .nav-link.active { color: var(--gold); }
        .input-field { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: #fff; font-size: 0.95rem; transition: all 0.3s; }
        .input-field:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,215,0,0.1); }
        textarea.input-field { resize: vertical; min-height: 120px; }
        .star-rating { display: flex; gap: 8px; }
        .star-rating i { font-size: 2rem; cursor: pointer; color: #333; transition: all 0.2s; }
        .star-rating i.active, .star-rating i:hover { color: var(--gold); transform: scale(1.15); }
        .category-btn { padding: 10px 18px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: #888; cursor: pointer; transition: all 0.3s; font-size: 0.85rem; font-weight: 500; }
        .category-btn.active, .category-btn:hover { background: rgba(255,215,0,0.1); border-color: var(--gold); color: var(--gold); }
        .toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 24px; border-radius: 12px; z-index: 9999; transform: translateY(150%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: var(--panel); border: 1px solid rgba(255,215,0,0.15); font-weight: 500; font-size: 0.9rem; color: var(--gold); }
        .toast.show { transform: translateY(0); }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>

    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-white/5" style="background: rgba(10,10,15,0.9); backdrop-filter: blur(20px);">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-yellow-400 to-yellow-600 flex items-center justify-center text-black font-black text-lg">CP</div>
                <span class="text-xl font-bold gradient-text">CreativePort</span>
            </div>
            <nav class="hidden md:flex items-center gap-8">
                <a href="front.html" class="nav-link">Home</a>
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="explore.html" class="nav-link">Explore</a>
                <a href="feedback.html" class="nav-link active">Feedback</a>
            </nav>
            <a href="dashboard.html" class="text-sm text-gray-400 hover:text-yellow-400 transition">
                <i class="fas fa-arrow-left mr-1"></i> Back
            </a>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-6 py-16">
        <div class="text-center mb-10">
            <p class="text-xs uppercase tracking-[0.3em] text-yellow-500/60 font-semibold mb-3">Your Opinion Matters</p>
            <h1 class="text-3xl md:text-4xl font-bold mb-3">Share Your <span class="gradient-text">Feedback</span></h1>
            <p class="text-gray-500 font-light">Help us improve CreativePort by sharing your experience.</p>
        </div>

        <form id="feedbackForm" class="glass p-8 md:p-10 space-y-6">
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wider">Your Name</label>
                <input type="text" id="fb-name" required class="input-field" placeholder="John Doe">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wider">Email Address</label>
                <input type="email" id="fb-email" required class="input-field" placeholder="you@example.com">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-3 uppercase tracking-wider">Rating</label>
                <div class="star-rating" id="star-rating">
                    <i class="fas fa-star" data-val="1"></i>
                    <i class="fas fa-star" data-val="2"></i>
                    <i class="fas fa-star" data-val="3"></i>
                    <i class="fas fa-star" data-val="4"></i>
                    <i class="fas fa-star" data-val="5"></i>
                </div>
                <input type="hidden" id="fb-rating" value="0">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-3 uppercase tracking-wider">Category</label>
                <div class="flex flex-wrap gap-2" id="category-buttons">
                    <button type="button" class="category-btn active" data-type="general">General</button>
                    <button type="button" class="category-btn" data-type="bug">Bug Report</button>
                    <button type="button" class="category-btn" data-type="feature">Feature Request</button>
                    <button type="button" class="category-btn" data-type="design">Design</button>
                </div>
                <input type="hidden" id="fb-type" value="general">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wider">Your Feedback</label>
                <textarea id="fb-message" required class="input-field" placeholder="Tell us what you think..."></textarea>
            </div>
            <button type="submit" id="submit-btn" class="btn-gold">
                <i class="fas fa-paper-plane mr-2"></i> Submit Feedback
            </button>
        </form>
    </main>

    <footer class="border-t border-white/5 py-6 text-center">
        <p class="text-gray-600 text-sm">&copy; 2026 CreativePort. All rights reserved.</p>
    </footer>

    <script>
        // Star Rating
        const stars = document.querySelectorAll('#star-rating i');
        stars.forEach(star => {
            star.addEventListener('click', () => {
                const val = parseInt(star.dataset.val);
                document.getElementById('fb-rating').value = val;
                stars.forEach((s, i) => s.classList.toggle('active', i < val));
            });
            star.addEventListener('mouseenter', () => {
                const val = parseInt(star.dataset.val);
                stars.forEach((s, i) => { if (i < val) s.style.color = '#FFD700'; });
            });
            star.addEventListener('mouseleave', () => {
                const current = parseInt(document.getElementById('fb-rating').value);
                stars.forEach((s, i) => { s.style.color = i < current ? '#FFD700' : '#333'; });
            });
        });

        // Category
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('fb-type').value = btn.dataset.type;
            });
        });

        // Submit
        document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Submitting...';

            const payload = {
                action: 'submit',
                name: document.getElementById('fb-name').value,
                email: document.getElementById('fb-email').value,
                rating: parseInt(document.getElementById('fb-rating').value),
                feedback_type: document.getElementById('fb-type').value,
                message: document.getElementById('fb-message').value
            };

            try {
                const res = await fetch('api/feedback.php', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.status === 'success') {
                    showToast('Thank you! Feedback submitted successfully.');
                    document.getElementById('feedbackForm').reset();
                    stars.forEach(s => s.classList.remove('active'));
                    document.getElementById('fb-rating').value = 0;
                } else showToast(data.message || 'Submission failed.');
            } catch (err) { showToast('Network error. Please try again.'); }

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i> Submit Feedback';
        });

        // Pre-fill from session
        (async () => {
            try {
                const res = await fetch('api/auth.php?action=check');
                const data = await res.json();
                if (data.data?.loggedIn && data.data.user) {
                    document.getElementById('fb-name').value = data.data.user.name || '';
                    document.getElementById('fb-email').value = data.data.user.email || '';
                }
            } catch (e) {}
        })();

        function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 4000); }
    </script>
</body>
</html>
