<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Templates | CreativePort</title>
    <meta name="description" content="Choose from premium portfolio templates designed for creative professionals.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; --gold-dark: #C5A000; --black: #0a0a0f; --panel: #111116; --border: #2a2a2f; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--black); color: #e8e8e8; min-height: 100vh; }
        .gradient-text { background: linear-gradient(135deg, var(--gold), #FFE55C); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nav-link { color: #888; transition: all 0.3s; font-weight: 500; font-size: 0.9rem; }
        .nav-link:hover, .nav-link.active { color: var(--gold); }
        .template-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; transition: all 0.3s; }
        .template-card:hover { border-color: rgba(255,215,0,0.3); transform: translateY(-5px); box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
        .btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #000; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: all 0.3s; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,215,0,0.3); }
        .btn-outline-gold { background: transparent; color: var(--gold); border: 1px solid rgba(255,215,0,0.3); padding: 10px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.3s; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
        .btn-outline-gold:hover { background: rgba(255,215,0,0.08); border-color: var(--gold); }
        .badge { padding: 4px 10px; border-radius: 999px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-gold { background: rgba(255,215,0,0.1); color: var(--gold); }
        .badge-free { background: rgba(34,197,94,0.1); color: #4ade80; }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-white/5" style="background: rgba(10,10,15,0.9); backdrop-filter: blur(20px);">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-yellow-400 to-yellow-600 flex items-center justify-center text-black font-black text-lg">CP</div>
                <span class="text-xl font-bold gradient-text">CreativePort</span>
            </div>
            <nav class="hidden md:flex items-center gap-8">
                <a href="front.html" class="nav-link">Home</a>
                <a href="explore.html" class="nav-link">Explore</a>
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="templates.html" class="nav-link active">Templates</a>
            </nav>
            <a href="create.html" class="btn-gold hidden md:inline-flex"><i class="fas fa-plus"></i> Create</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-16">
        <div class="text-center mb-16">
            <p class="text-xs uppercase tracking-[0.3em] text-yellow-500/60 font-semibold mb-3">Premium Collection</p>
            <h1 class="text-4xl md:text-5xl font-bold mb-4">Template <span class="gradient-text">Gallery</span></h1>
            <p class="text-gray-500 max-w-lg mx-auto font-light">Choose a template and start building your portfolio in minutes.</p>
        </div>

        <!-- Templates from DB -->
        <div id="template-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-16">
            <div class="text-center col-span-full py-12"><i class="fas fa-spinner fa-spin text-yellow-500 text-2xl"></i></div>
        </div>

    </main>

    <footer class="border-t border-white/5 py-6 text-center">
        <p class="text-gray-600 text-sm">&copy; 2026 CreativePort. All rights reserved.</p>
    </footer>

    <script>
        const fallbackMap = {
            'cinematic': 'https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&q=60&w=400',
            'cyberpunk': 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&q=60&w=400',
            'hacker': 'https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&q=60&w=400',
            'modern': 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&q=60&w=400',
            'magazine': 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&q=60&w=400',
            'photography': 'https://images.unsplash.com/photo-1452784444945-3f422708fe5e?auto=format&fit=crop&q=60&w=400',
            'minimal': 'https://images.unsplash.com/photo-1483058712412-4245e9b90334?auto=format&fit=crop&q=60&w=400',
            'bento': 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&q=60&w=400',
            'game': 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&q=60&w=400',
            'creative': 'https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&q=60&w=400'
        };

        function getFallback(t) {
            // Guaranteed 100% unique and reliable visuals
            return `https://picsum.photos/seed/${t.slug}/600/400`;
        }

        async function loadTemplates() {
            try {
                const res = await fetch('api/portfolio.php?action=templates');
                const data = await res.json();
                if (data.status === 'success' && data.data.templates.length > 0) {
                    const grid = document.getElementById('template-grid');
                    grid.innerHTML = data.data.templates.map(t => `
                        <div class="template-card">
                            <div class="h-48 relative overflow-hidden bg-neutral-900 group border-b border-white/5">
                                <!-- Browser Header Mockup -->
                                <div class="absolute top-0 left-0 right-0 h-6 bg-neutral-800/80 backdrop-blur-md flex items-center px-3 gap-1 z-10">
                                    <div class="w-1.5 h-1.5 rounded-full bg-red-500/50"></div>
                                    <div class="w-1.5 h-1.5 rounded-full bg-yellow-500/50"></div>
                                    <div class="w-1.5 h-1.5 rounded-full bg-green-500/50"></div>
                                    <div class="ml-2 h-3 bg-white/5 rounded-full w-24"></div>
                                </div>
                                <img src="${t.preview_image || getFallback(t)}" 
                                     alt="${t.name}" 
                                     class="w-full h-full object-cover opacity-60 group-hover:opacity-100 group-hover:scale-105 transition-all duration-700 pt-6"
                                     onerror="this.onerror=null; this.src=getFallback(t);">
                                <div class="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-transparent"></div>
                                <div class="absolute top-8 right-3 flex gap-2">
                                    ${t.is_premium ? '<span class="badge badge-gold shadow-lg shadow-black/50"><i class="fas fa-crown"></i> Premium</span>' : '<span class="badge badge-free shadow-lg shadow-black/50">Free</span>'}
                                </div>
                            </div>
                            <div class="p-5">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="font-bold text-white">${escapeHtml(t.name)}</h3>
                                    <span class="text-[10px] text-yellow-500/50 uppercase tracking-widest font-mono">${t.category || 'Portfolio'}</span>
                                </div>
                                <p class="text-gray-500 text-xs mb-6 font-light h-8 overflow-hidden leading-relaxed">${escapeHtml(t.description || 'Professional premium design.')}</p>
                                <div class="flex gap-2">
                                    <a href="create.html?template=${t.id}" class="btn-gold flex-1 justify-center text-xs py-2">
                                        Use This
                                    </a>
                                    <a href="preview.php?template=${t.slug}" target="_blank" class="btn-outline-gold px-4 py-2 text-xs">
                                        <i class="fas fa-eye"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('template-grid').innerHTML = '<p class="text-gray-500 text-center col-span-full">No templates found.</p>';
                }
            } catch (e) {
                document.getElementById('template-grid').innerHTML = '<p class="text-gray-500 text-center col-span-full">Database connection error.</p>';
            }
        }
        function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        loadTemplates();
    </script>
</body>
</html>
