<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Portfolios | CreativePort</title>
    <meta name="description" content="Discover amazing portfolios from talented creators around the world.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; --gold-dark: #C5A000; --black: #0a0a0f; --panel: #111116; --border: #2a2a2f; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--black); color: #e8e8e8; min-height: 100vh; }
        .gradient-text { background: linear-gradient(135deg, var(--gold), #FFE55C); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .glass { background: rgba(255,215,0,0.03); border: 1px solid rgba(255,215,0,0.08); border-radius: 16px; }
        .btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #000; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: all 0.3s; font-size: 0.85rem; }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,215,0,0.3); }
        .nav-link { color: #888; transition: all 0.3s; font-weight: 500; font-size: 0.9rem; }
        .nav-link:hover, .nav-link.active { color: var(--gold); }
        .portfolio-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; transition: all 0.3s; }
        .portfolio-card:hover { border-color: rgba(255,215,0,0.2); transform: translateY(-4px); box-shadow: 0 15px 40px rgba(0,0,0,0.4); }
        .search-input { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 14px 20px 14px 48px; color: white; width: 100%; font-size: 0.95rem; transition: all 0.3s; }
        .search-input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,215,0,0.1); }
        .filter-btn { padding: 8px 16px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; border: 1px solid var(--border); background: transparent; color: #888; cursor: pointer; transition: all 0.3s; }
        .filter-btn:hover, .filter-btn.active { background: rgba(255,215,0,0.1); border-color: var(--gold); color: var(--gold); }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-white/5" style="background: rgba(10,10,15,0.9); backdrop-filter: blur(20px);">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-yellow-400 to-yellow-600 flex items-center justify-center text-black font-black text-lg">CP</div>
                <span class="text-xl font-bold gradient-text">CreativePort</span>
            </div>
            <nav class="hidden md:flex items-center gap-8">
                <a href="front.html" class="nav-link">Home</a>
                <a href="explore.html" class="nav-link active">Explore</a>
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="about.html" class="nav-link">About</a>
            </nav>
            <a href="create.html" class="btn-gold hidden md:inline-flex items-center gap-2"><i class="fas fa-plus"></i> Create</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <!-- Search & Filters -->
        <div class="text-center mb-12">
            <p class="text-xs uppercase tracking-[0.3em] text-yellow-500/60 font-semibold mb-3">Discover</p>
            <h1 class="text-4xl md:text-5xl font-bold mb-4">Explore <span class="gradient-text">Portfolios</span></h1>
            <p class="text-gray-500 max-w-lg mx-auto font-light mb-8">Discover stunning portfolios created by talented professionals</p>
            <div class="relative max-w-xl mx-auto mb-6">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                <input type="text" id="search-input" class="search-input" placeholder="Search portfolios, skills, or creators..." onkeydown="if(event.key==='Enter') searchPortfolios()">
            </div>
            <div class="flex flex-wrap justify-center gap-2" id="filter-buttons">
                <button class="filter-btn active" onclick="setSort('recent', this)">Recent</button>
                <button class="filter-btn" onclick="setSort('popular', this)">Popular</button>
                <button class="filter-btn" onclick="setSort('score', this)">Top Rated</button>
            </div>
        </div>

        <!-- Results -->
        <div id="portfolio-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        <div id="empty-state" class="hidden text-center py-20">
            <i class="fas fa-search text-5xl text-yellow-500/10 mb-4"></i>
            <h3 class="text-xl font-semibold text-gray-300 mb-2">No Portfolios Found</h3>
            <p class="text-gray-500">Try a different search or filter.</p>
        </div>
        <div id="loading" class="text-center py-12">
            <i class="fas fa-spinner fa-spin text-yellow-500 text-2xl"></i>
        </div>
    </main>

    <footer class="border-t border-white/5 py-6 text-center">
        <p class="text-gray-600 text-sm">&copy; 2026 CreativePort. All rights reserved.</p>
    </footer>

    <script>
        let currentSort = 'recent';
        let currentPage = 1;

        function setSort(sort, btn) {
            currentSort = sort; currentPage = 1;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadPortfolios();
        }

        async function searchPortfolios() {
            const q = document.getElementById('search-input').value.trim();
            if (!q) { loadPortfolios(); return; }
            document.getElementById('loading').classList.remove('hidden');
            try {
                const res = await fetch(`api/explore.php?action=search&q=${encodeURIComponent(q)}`);
                const data = await res.json();
                if (data.status === 'success') renderPortfolios(data.data.results);
            } catch (e) { console.error(e); }
            document.getElementById('loading').classList.add('hidden');
        }

        async function loadPortfolios() {
            document.getElementById('loading').classList.remove('hidden');
            try {
                const res = await fetch(`api/explore.php?action=browse&sort=${currentSort}&page=${currentPage}`);
                const data = await res.json();
                if (data.status === 'success') renderPortfolios(data.data.portfolios);
            } catch (e) { console.error(e); }
            document.getElementById('loading').classList.add('hidden');
        }

        function renderPortfolios(portfolios) {
            const grid = document.getElementById('portfolio-grid');
            const empty = document.getElementById('empty-state');
            if (!portfolios || portfolios.length === 0) {
                grid.innerHTML = ''; empty.classList.remove('hidden'); return;
            }
            empty.classList.add('hidden');
            grid.innerHTML = portfolios.map(p => `
                <a href="portfolio/${p.slug}" target="_blank" class="portfolio-card block">
                    <div class="h-44 relative" style="background: linear-gradient(135deg, rgba(255,215,0,0.06) 0%, rgba(10,10,15,1) 100%);">
                        <div class="absolute inset-0 flex items-center justify-center"><i class="fas fa-cube text-4xl text-yellow-500/8"></i></div>
                    </div>
                    <div class="p-5">
                        <h3 class="font-bold text-white mb-1">${escapeHtml(p.title || 'Untitled')}</h3>
                        <p class="text-sm text-gray-500 mb-3">by ${escapeHtml(p.author_name || 'Anonymous')}</p>
                        <div class="flex items-center justify-between text-xs text-gray-500">
                            <span><i class="fas fa-eye mr-1"></i>${p.view_count || 0} views</span>
                            <span class="text-yellow-500/70"><i class="fas fa-star mr-1"></i>${p.score || 0}</span>
                        </div>
                    </div>
                </a>
            `).join('');
        }

        function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        loadPortfolios();
    </script>
</body>
</html>
